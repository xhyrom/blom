type: application
language: typescript

project:
  name: www
  description: Documentation website for the Blom programming language

tasks:
  install:
    description: Install dependencies
    script: |
      bun install

  build:
    description: Build the website
    command: bun run build
    deps:
      - install
    inputs:
      - "src/**/*"
      - "public/**/*"
    outputs:
      - "dist"

  dev:
    description: Start the development server
    command: bun run dev
    inputs:
      - "src/**/*"
      - "public/**/*"
    outputs:
      - "dist"
    local: true
