type: application
language: go

project:
  name: toolchain
  description: Toolchain for the Blom programming language

tasks:
  build:
    description: Build the toolchain
    script: |
      go build -o bin/blomc ./cmd/blom
      go build -o bin/blom ./cmd/blom
      go build -o bin/blomprism ./cmd/blomprism
      go build -o bin/blomray ./cmd/blomray
      go build -o bin/blomsight ./cmd/blomsight
    inputs:
      - "analyzer/**/*"
      - "ast/**/*"
      - "cmd/**/*"
      - "compiler/**/*"
      - "debug/**/*"
      - "lexer/**/*"
      - "parser/**/*"
      - "scope/**/*"
      - "tokens/**/*"
    outputs:
      - "bin/blom"
      - "bin/blomc"
      - "bin/blomprism"
      - "bin/blomray"
      - "bin/blomsight"

  test:
    description: Run the tests
    command: go test ./parser/...
