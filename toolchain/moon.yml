type: application
language: go

project:
  name: toolchain
  description: Toolchain for the Blom programming language

tasks:
  build:
    description: Build the toolchain
    script: |
      go build -o bin/blomc ./cmd/blom
      go build -o bin/blom ./cmd/blom
      go build -o bin/blomprism ./cmd/blomprism
      go build -o bin/blomray ./cmd/blomray
      go build -o bin/blomsight ./cmd/blomsight
    inputs:
      - "analyzer/**/*"
      - "ast/**/*"
      - "cmd/**/*"
      - "compiler/**/*"
      - "debug/**/*"
      - "interpreter/**/*"
      - "lexer/**/*"
      - "mangling/**/*"
      - "parser/**/*"
      - "qbe/**/*"
      - "scope/**/*"
      - "tokens/**/*"
      - "transpiler/**/*"
    outputs:
      - "bin/blom"
      - "bin/blomc"
      - "bin/blomp"
  test:
    deps:
      - test-qbe
      - test-parser
  test-qbe:
    description: Run the qbe tests
    command: go test ./qbe/...
    inputs:
      - "qbe/tests/*.go"
  test-parser:
    description: Run the parser tests
    command: go test ./parser/...
    inputs:
      - "parser/tests/*.go"
